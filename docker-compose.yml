# Wiki.js 知识库：页面、层级目录、Markdown 和所见即所得编辑器，按组和页面规则分配权限。
# 登录走核心的身份提供方（OIDC），打开网页即以主人身份进入，不出现 Wiki.js 自己的登录页。
# 上游官方镜像 ghcr.io/requarks/wiki，按清单列表（index）的摘要固定；3.x 只认 PostgreSQL，库用同一个包里的服务。
name: wikijs

services:
  db:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      TZ: ${TZ}
      POSTGRES_DB: wiki
      POSTGRES_USER: wiki
      POSTGRES_PASSWORD: ${WONTON_SECRET_DB_PASSWORD}
    volumes:
      - ${WONTON_APP_DATA}/db:/var/lib/postgresql
    healthcheck:
      # 镜像自带的官方检查：连得上、库已建好并接受查询。
      test: ["CMD", "pg_isready", "-U", "wiki", "-d", "wiki"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  wiki:
    image: ghcr.io/requarks/wiki:3.2.0@sha256:b0ad43b76e8663c8125b2d1cf560f0c6537731024f0a8abd4d8f19478d367f32
    # 镜像以 node 用户运行；数据目录归用户的用户。
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      # 配置从包里的 config.yml 读，库的参数经 `$(名字)` 由启动时代入。
      CONFIG_FILE: /etc/wiki/config.yml
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: wiki
      DB_PASS: ${WONTON_SECRET_DB_PASSWORD}
      DB_NAME: wiki
      DB_SCHEMA: wiki
      # 根管理员只在第一次启动、库还空着时创建：密码核心生成，日常登录走云吞身份，它只作兜底。
      ADMIN_EMAIL: admin@wonton.local
      ADMIN_PASS: ${WONTON_SECRET_ADMIN_PASSWORD}
      # Wiki.js 的账号必须有邮箱，而核心只在主人配了邮箱时才发 email 声明；引用它让没配的主人在安装时就停下，
      # 而不是打开网页才在登录时报错。
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL:?核心没有注入主人邮箱，先在云吞里配好}
    volumes:
      - ${WONTON_APP_DATA}/data:/data
    configs:
      - source: config
        target: /etc/wiki/config.yml
      - source: health
        target: /etc/wiki/health.mjs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 应用答得出启动接口、库真连得上才算可用，见 config/health.mjs。
      test: ["CMD", "node", "/etc/wiki/health.mjs"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
      start_interval: 5s
    restart: unless-stopped

  # 一次性服务：接上核心的 OIDC、设站点和反代信任。都写最终值，每次创建容器都跑一遍。
  init:
    image: ghcr.io/requarks/wiki:3.2.0@sha256:b0ad43b76e8663c8125b2d1cf560f0c6537731024f0a8abd4d8f19478d367f32
    user: "${PUID}:${PGID}"
    entrypoint: ["node", "/etc/wiki/init.mjs"]
    environment:
      TZ: ${TZ}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: wiki
      DB_PASS: ${WONTON_SECRET_DB_PASSWORD}
      DB_NAME: wiki
      WONTON_APP_URL: ${WONTON_APP_URL}
      WONTON_OWNER_EMAIL: ${WONTON_OWNER_EMAIL}
      WONTON_SECRET_ADMIN_PASSWORD: ${WONTON_SECRET_ADMIN_PASSWORD}
      WONTON_OIDC_ISSUER: ${WONTON_OIDC_ISSUER}
      WONTON_OIDC_CLIENT_ID: ${WONTON_OIDC_CLIENT_ID}
      WONTON_OIDC_CLIENT_SECRET: ${WONTON_OIDC_CLIENT_SECRET}
      # 附件和评论自动迁移不搬：默认停下报数量，插件页里把这一项填 1 表示确认丢弃、继续装（见 README）。
      WIKIJS_UPGRADE_DROP_ATTACHMENTS_COMMENTS: ${WONTON_SECRET_UPGRADE_DROP_ATTACHMENTS_COMMENTS:-}
    volumes:
      - ${WONTON_APP_DATA}/data:/data
    configs:
      - source: init
        target: /etc/wiki/init.mjs
      - source: migrate
        target: /etc/wiki/migrate2.mjs
    depends_on:
      wiki:
        condition: service_healthy
    restart: "no"

configs:
  config:
    file: config/config.yml
  health:
    file: config/health.mjs
  init:
    file: config/init.mjs
  migrate:
    file: config/migrate2.mjs

x-wonton:
  # 升级开关用主人填的密钥（input 密钥从 0.8 起）；spec 写现行的 0.11。
  spec: "0.11"
  id: io.requarks.wikijs
  version: 0.1.0
  kind: app
  title: { zh: 家庭维基（Wiki.js）, en: Home Wiki (Wiki.js) }
  description: { zh: 像家里自己的维基百科：页面互相链接、每次修改都留历史，谁能看、谁能改按组设。适合全家一起写、一起补充的资料页。, en: "Your household's own Wikipedia: pages link to each other, every edit is kept in history, and you decide by group who can read or edit. For pages the whole family writes together." }
  icon: icon.png
  notices: [NOTICE]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://js.wiki
  license: AGPL-3.0-only
  tags:
    zh: [知识库, 文档, 笔记]
    en: [Wiki, Docs, Notes]
  about:
    zh: |
      写下来就不丢：页面带层级目录、版本历史和标签，可以按组分配读写权限。默认只有主人看得到，访客组可以放开给不登录的人。

      搜索按标题、描述和正文做全文检索。

      界面语言默认中文，语言包首次打开时从上游下载，需要联网；断网时是英文。
    en: |
      Write it down and it stays: pages with a nested tree, version history and tags. Grant read or write per group, or publish to the whole network.

      Search is full text over page titles, descriptions and bodies.

      The interface defaults to Chinese and the language pack is downloaded from upstream on first open, so it needs internet; without it the interface stays English.
  release_notes: { zh: 第一个版本。, en: First release. }
  webui:
    service: wiki
    port: 3000
    sso: oidc
    oidc:
      # 回调地址里带策略的 UUID；init 把策略的 id 固定成同一个值（见 config/init.mjs）。
      redirect_paths: [/_api/auth/4d18c8a0-1f2b-4a5e-9d0e-6c1f5a7b9c31/callback]
      # Wiki.js 的 OIDC 客户端把密钥放在令牌请求的表单体里，不做 Basic 认证。
      token_endpoint_auth_method: client_secret_post
  secrets:
    # 库的密码核心生成，只给 db 和 wiki 用。
    db_password:
      generate: { bytes: 32 }
    # 根管理员是兜底入口，界面上不显示登录表单；密码只给初始化脚本用。
    admin_password:
      generate: { bytes: 32 }
    # 升级开关：附件和评论自动迁移不搬，填 1 表示确认丢弃它们继续装（见 README“从 2.x 升级”）。
    # 这个值不是密钥，但密钥是插件拿到主人输入的唯一通道。
    upgrade_drop_attachments_comments:
      input:
        title: { zh: 升级时丢弃附件和评论, en: Drop attachments and comments on upgrade }
        description:
          zh: 从 2.x 升级、2.x 里有附件或评论时，装 1 才继续（这两样自动迁移不搬）。不是升级可以留空。
          en: Set to 1 to continue when upgrading from 2.x that has attachments or comments (the automatic import leaves both behind). Leave empty otherwise.
        required: false
  permissions:
    - owner.identity
    # 界面语言包、扩展更新都从上游的仓库读；页面本身不联网。
    - network.egress
  # 上游写最低内存 1G；本机只装知识库，取 1G。镜像支持 amd64 和 arm64（清单列表里有这两个平台的 manifest）。
  requirements:
    arch: [amd64, arm64]
    memory: 1G
